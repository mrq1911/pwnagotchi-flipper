# Build a Marauder firmware that includes the `pwnfriend` command, so the ESP32
# can be flashed once and drive both the Marauder GUI and the pwnfriend app.
#
# It clones a Marauder fork, runs pwnfriend-marauder/apply_pwnfriend.py to add
# the command, then builds with the same toolchain/libraries the Feberis fork's
# own nightly uses (arduino-test-compile + pinned libs). The resulting .bin is
# uploaded as an artifact you flash with ESP Flasher / a web flasher.
#
# NOTE: This is adapted from bpmcircuits/ESP32Marauder_FEBERIS .github nightly.
# The Feberis Pro's exact chip (S3 vs classic ESP32) is not documented, so its
# matrix entry is a best guess — confirm your chip via ESP Flasher and adjust
# `fqbn`/`idf_ver`/`flag` if the Feberis build fails. The S2 devboard entry is
# known-good and proves the pipeline.

name: build-pwnfriend

on:
  workflow_dispatch:
    inputs:
      marauder_repo:
        description: Marauder fork to build (owner/name)
        default: bpmcircuits/ESP32Marauder_FEBERIS
      marauder_ref:
        description: git ref of that fork
        default: feberis
  push:
    paths:
      - pwnfriend-marauder/**
      - .github/workflows/build-pwnfriend.yml

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          # Known-good baseline: the official Flipper Wi-Fi Dev Board (ESP32-S2).
          - name: flipper-devboard-s2
            flag: MARAUDER_FLIPPER
            fqbn: "esp32:esp32:esp32s2:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=enabled"
            idf_ver: "2.0.11"
            nimble_ver: "1.3.8"
          # Feberis Pro — best guess (has BT, so not S2). Confirm chip & adjust.
          - name: feberis-pro
            flag: BPMCIRCUITS_FEBERIS_PRO
            fqbn: "esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashSize=4M"
            idf_ver: "2.0.11"
            nimble_ver: "1.3.8"
    steps:
      - name: Checkout pwnfriend (this repo)
        uses: actions/checkout@v4
        with:
          path: pwnfriend

      - name: Checkout Marauder fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.marauder_repo || 'bpmcircuits/ESP32Marauder_FEBERIS' }}
          ref: ${{ github.event.inputs.marauder_ref || 'feberis' }}
          path: marauder

      - name: Add the pwnfriend command
        run: python3 pwnfriend/pwnfriend-marauder/apply_pwnfriend.py marauder

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      # Pinned libraries, mirroring the fork's nightly build.
      - uses: actions/checkout@v4
        with: { repository: marian-craciunescu/ESP32Ping, ref: "1.6", path: marauder/CustomESP32Ping }
      - uses: actions/checkout@v4
        with: { repository: ESP32Async/AsyncTCP, ref: v3.4.8, path: marauder/CustomAsyncTCP }
      - uses: actions/checkout@v4
        with: { repository: stevemarple/MicroNMEA, ref: v2.0.6, path: marauder/CustomMicroNMEA }
      - uses: actions/checkout@v4
        with: { repository: ESP32Async/ESPAsyncWebServer, ref: v3.8.1, path: marauder/CustomESPAsyncWebServer }
      - uses: actions/checkout@v4
        with: { repository: Bodmer/TFT_eSPI, ref: V2.5.34, path: marauder/CustomTFT_eSPI }
      - uses: actions/checkout@v4
        with: { repository: PaulStoffregen/XPT2046_Touchscreen, ref: v1.4, path: marauder/CustomXPT2046_Touchscreen }
      - uses: actions/checkout@v4
        with: { repository: lvgl/lv_arduino, ref: 3.0.0, path: marauder/Customlv_arduino }
      - uses: actions/checkout@v4
        with: { repository: Bodmer/JPEGDecoder, ref: 1.8.0, path: marauder/CustomJPEGDecoder }
      - uses: actions/checkout@v4
        with: { repository: h2zero/NimBLE-Arduino, ref: "${{ matrix.board.nimble_ver }}", path: marauder/CustomNimBLE-Arduino }
      - uses: actions/checkout@v4
        with: { repository: adafruit/Adafruit_NeoPixel, ref: 1.12.0, path: marauder/CustomAdafruit_NeoPixel }
      - uses: actions/checkout@v4
        with: { repository: bblanchon/ArduinoJson, ref: v6.18.2, path: marauder/CustomArduinoJson }
      - uses: actions/checkout@v4
        with: { repository: ivanseidel/LinkedList, ref: v1.3.3, path: marauder/CustomLinkedList }
      - uses: actions/checkout@v4
        with: { repository: plerup/espsoftwareserial, ref: 8.1.0, path: marauder/CustomEspSoftwareSerial }
      - uses: actions/checkout@v4
        with: { repository: adafruit/Adafruit_BusIO, ref: 1.15.0, path: marauder/CustomAdafruit_BusIO }
      - uses: actions/checkout@v4
        with: { repository: adafruit/Adafruit_MAX1704X, ref: 1.0.2, path: marauder/CustomAdafruit_MAX1704X }

      - name: Configure TFT_eSPI
        working-directory: marauder
        run: |
          rm -f CustomTFT_eSPI/User_Setup_Select.h
          cp User*.h CustomTFT_eSPI/ || true

      - name: Patch platform.txt for -zmuldefs (idf 2.0.11)
        run: |
          for i in $(find ~/.arduino15/packages/esp32/hardware/esp32/ -name platform.txt 2>/dev/null); do
            sed -i 's/compiler.c.elf.libs.esp32s3=/compiler.c.elf.libs.esp32s3=-zmuldefs /' "$i" || true
            sed -i 's/compiler.c.elf.libs.esp32s2=/compiler.c.elf.libs.esp32s2=-zmuldefs /' "$i" || true
            sed -i 's/compiler.c.elf.libs.esp32=/compiler.c.elf.libs.esp32=-zmuldefs /' "$i" || true
          done
        continue-on-error: true

      - name: Build (${{ matrix.board.name }})
        uses: ArminJo/arduino-test-compile@v3.3.0
        with:
          sketch-names: esp32_marauder.ino
          arduino-board-fqbn: ${{ matrix.board.fqbn }}
          extra-arduino-cli-args: "--warnings none --build-property compiler.cpp.extra_flags='-D${{ matrix.board.flag }}'"
          arduino-platform: esp32:esp32@${{ matrix.board.idf_ver }}
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json
          sketch-directory: marauder/esp32_marauder

      - name: Collect firmware
        run: |
          mkdir -p out
          find marauder -name "esp32_marauder.ino*.bin" -exec cp {} out/ \;
          ls -la out

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwnfriend-${{ matrix.board.name }}
          path: out/*.bin
          if-no-files-found: warn
